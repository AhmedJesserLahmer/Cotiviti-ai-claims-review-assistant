# Root entrypoint for local development. The real definition lives in
# infra/docker/compose.yaml so all infrastructure code sits under infra/.
# `docker compose up` from the repo root keeps working; secrets such as
# GROQ_API_KEY are read from the root .env file (optional, see .env.example).
name: claims-review

include:
  - path: infra/docker/compose.yaml
    project_directory: infra/docker
