version: 2
updates:
  - package-ecosystem: pip
    directory: /services/claims-api
    schedule: {interval: weekly}
    groups: {python-minor: {update-types: [minor, patch]}}
  - package-ecosystem: pip
    directory: /services/ai-agent
    schedule: {interval: weekly}
    groups: {python-minor: {update-types: [minor, patch]}}
  - package-ecosystem: pip
    directory: /services/ml-service
    schedule: {interval: weekly}
    groups: {python-minor: {update-types: [minor, patch]}}
  - package-ecosystem: npm
    directory: /frontend
    schedule: {interval: weekly}
    groups: {npm-minor: {update-types: [minor, patch]}}
  - package-ecosystem: docker
    directories: [/services/claims-api, /services/ai-agent, /services/ml-service, /frontend]
    schedule: {interval: weekly}
  - package-ecosystem: github-actions
    directory: /
    schedule: {interval: monthly}
