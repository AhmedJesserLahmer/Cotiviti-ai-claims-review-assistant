# Local development stack. Start from the repo root: `docker compose up -d`
# (or `make up`). Build one service at a time: `make build SERVICE=claims-api`.
#
#   browser ─► frontend :3000 ─► claims-api :8000 ─► ai-agent :8002 ─► ml-service :8001
#                                    │   ▲                │                 │
#                                    ▼   │ jobs           ▼                 ▼
#                                  redis ─► claims-worker   └──── mongo ────┘
#
# Only the frontend and claims-api publish ports; the other services are internal.

x-python-healthcheck: &python-healthcheck
  interval: 10s
  timeout: 3s
  retries: 6

x-service-env: &service-env
  MONGO_URI: mongodb://mongo:27017
  MONGO_DB_NAME: claims_poc
  LOG_FORMAT: json
  # Service-to-service shared secret; set INTERNAL_TOKEN in .env to enable checks.
  INTERNAL_TOKEN: ${INTERNAL_TOKEN:-}
  # Traces go to Jaeger when the observability profile runs; harmless otherwise.
  OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}

services:
  mongo:
    image: mongo:7
    container_name: claims_poc_mongo
    # The default WiredTiger cache is ~50% of RAM; the dataset is a few MB.
    command: ["mongod", "--wiredTigerCacheSizeGB", "0.25"]
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: claims_poc_redis
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "128mb", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  ml-service:
    build:
      context: ../..
      dockerfile: services/ml-service/Dockerfile
    container_name: claims_poc_ml_service
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      <<: *service-env
      SERVICE_NAME: ml-service
    expose:
      - "8001"
    healthcheck:
      <<: *python-healthcheck
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health/ready', timeout=2)"]
      start_period: 60s

  ai-agent:
    build:
      context: ../..
      dockerfile: services/ai-agent/Dockerfile
    container_name: claims_poc_ai_agent
    depends_on:
      mongo:
        condition: service_healthy
      ml-service:
        condition: service_healthy
    # Secrets and AI tuning (GROQ_API_KEY, GROQ_MODEL, AI_*) come from the root .env.
    env_file:
      - path: ../../.env
        required: false
    environment:
      <<: *service-env
      SERVICE_NAME: ai-agent
      ML_SERVICE_URL: http://ml-service:8001
    expose:
      - "8002"
    healthcheck:
      <<: *python-healthcheck
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8002/health/ready', timeout=2)"]
      start_period: 30s

  claims-api:
    build:
      context: ../..
      dockerfile: services/claims-api/Dockerfile
    container_name: claims_poc_claims_api
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
      ai-agent:
        condition: service_healthy
    # Optional root .env (e.g. CORS_ORIGINS). Values under `environment` win.
    env_file:
      - path: ../../.env
        required: false
    environment: &claims-api-env
      <<: *service-env
      SERVICE_NAME: claims-api
      AI_AGENT_URL: http://ai-agent:8002
      ML_SERVICE_URL: http://ml-service:8001
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"

  claims-worker:
    build:
      context: ../..
      dockerfile: services/claims-api/Dockerfile
    container_name: claims_poc_claims_worker
    entrypoint: ["arq", "core.worker.WorkerSettings"]
    healthcheck:
      disable: true
    depends_on:
      redis:
        condition: service_healthy
      ai-agent:
        condition: service_healthy
    environment:
      <<: *claims-api-env
      SERVICE_NAME: claims-worker

  frontend:
    build:
      context: ../../frontend
      args:
        # Browser-side calls hit the API through the host-published port.
        NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
    container_name: claims_poc_frontend
    depends_on:
      - claims-api
    environment:
      # Server-side (SSR) calls stay inside the compose network.
      INTERNAL_API_BASE_URL: http://claims-api:8000
    ports:
      - "3000:3000"

  # --- optional observability stack: docker compose --profile observability up -d ---
  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: claims_poc_prometheus
    profiles: ["observability"]
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=3d"]
    volumes:
      - ../observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      # Alert rules are shared with the Helm chart's PrometheusRule (single source).
      - ../helm/claims-review/files/prometheus:/etc/prometheus/rules:ro
    ports:
      - "9090:9090"
    mem_limit: 256m

  grafana:
    image: grafana/grafana:11.3.1
    container_name: claims_poc_grafana
    profiles: ["observability"]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ../observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../helm/claims-review/files/grafana:/var/lib/grafana/dashboards:ro
    ports:
      - "3001:3000"
    depends_on:
      - prometheus
    mem_limit: 256m

  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    container_name: claims_poc_jaeger
    profiles: ["observability"]
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"   # UI; set OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4318 in .env
    mem_limit: 256m

volumes:
  mongo_data:
  redis_data:
