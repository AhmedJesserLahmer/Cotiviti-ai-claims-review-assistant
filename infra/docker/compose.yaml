services:
  mongo:
    image: mongo:7
    container_name: claims_poc_mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ../..
      dockerfile: services/claims-api/Dockerfile
    container_name: claims_poc_backend
    depends_on:
      mongo:
        condition: service_healthy
      ai-agent:
        condition: service_started
    # Optional root .env (e.g. CORS_ORIGINS). Values under `environment` win over
    # env_file, so the container always talks to the compose-network services.
    env_file:
      - path: ../../.env
        required: false
    environment:
      MONGO_URI: mongodb://mongo:27017
      MONGO_DB_NAME: claims_poc
      AI_AGENT_URL: http://ai-agent:8002
    ports:
      - "8000:8000"

  ml-service:
    build:
      context: ../..
      dockerfile: services/ml-service/Dockerfile
    container_name: claims_poc_ml_service
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      MONGO_URI: mongodb://mongo:27017
      MONGO_DB_NAME: claims_poc
    # Internal only: reached as http://ml-service:8001.
    expose:
      - "8001"

  ai-agent:
    build:
      context: ../..
      dockerfile: services/ai-agent/Dockerfile
    container_name: claims_poc_ai_agent
    depends_on:
      mongo:
        condition: service_healthy
    # Secrets and AI tuning (GROQ_API_KEY, GROQ_MODEL, AI_*) come from the root .env.
    env_file:
      - path: ../../.env
        required: false
    environment:
      MONGO_URI: mongodb://mongo:27017
      MONGO_DB_NAME: claims_poc
    # Internal only: no published port, reached as http://ai-agent:8002.
    expose:
      - "8002"

  frontend:
    build:
      context: ../../frontend
      args:
        # Browser-side calls hit the API through the host-published port.
        NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
    container_name: claims_poc_frontend
    depends_on:
      - backend
    environment:
      # Server-side (SSR) calls stay inside the compose network.
      INTERNAL_API_BASE_URL: http://backend:8000
    ports:
      - "3000:3000"

volumes:
  mongo_data:
