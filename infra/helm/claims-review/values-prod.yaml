# Production: managed MongoDB/Redis, secrets from the secret manager only,
# authentication required, HA replicas with autoscaling and PDBs, monitoring on.
global:
  environment: prod
  imageTag: ""   # pinned to a released version by Argo CD
  logLevel: INFO

secrets:
  create: false
  externalSecrets:
    enabled: true
    remoteKey: claims-review/prod

claimsApi:
  env:
    CORS_ORIGINS: "https://claims.example.com"
    AUTH_ENABLED: "true"
    JWT_ISSUER: "https://idp.example.com/realms/claims"
    JWT_AUDIENCE: "claims-api"
  autoscaling: {minReplicas: 3, maxReplicas: 10}
  pdb: {minAvailable: 2}
aiAgent:
  env:
    AI_JUDGE_ENABLED: "true"
    AI_HEDGE_AFTER_S: "8"
    AI_PROMPT_TRAFFIC: ""
  autoscaling: {minReplicas: 3, maxReplicas: 12}
  pdb: {minAvailable: 2}
mlService:
  autoscaling: {minReplicas: 2, maxReplicas: 6}
worker:
  replicas: 2
  pdb: {enabled: true, minAvailable: 1}
frontend:
  replicas: 3
  autoscaling: {enabled: true, minReplicas: 3, maxReplicas: 6}
  pdb: {minAvailable: 2}

mongodb:
  enabled: false
  externalUri: "mongodb+srv://claims-prod.example.mongodb.net/?retryWrites=true&w=majority&tls=true"
redis:
  enabled: false
  externalUrl: "rediss://claims-prod.example.cache.amazonaws.com:6379/0"

seedJob:
  enabled: false   # real data: never seed synthetic records

ingress:
  enabled: true
  hosts:
    app: claims.example.com
    api: api.claims.example.com
  tls:
    clusterIssuer: letsencrypt-prod
  oauth2Proxy:
    enabled: true

training:
  enabled: true
  activate: false

observability:
  otlpEndpoint: http://otel-collector.monitoring:4318
  serviceMonitor: {enabled: true}
  prometheusRule: {enabled: true}
  grafanaDashboard: {enabled: true}
