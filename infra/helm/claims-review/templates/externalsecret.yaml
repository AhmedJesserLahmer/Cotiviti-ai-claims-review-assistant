{{- if .Values.secrets.externalSecrets.enabled }}
{{- $es := .Values.secrets.externalSecrets }}
# Synced by External Secrets Operator from the cloud secret manager (AWS Secrets
# Manager, GCP Secret Manager, Vault, ...). No secret material lives in values files.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "claims-review.secretName" . }}
  labels:
    {{- include "claims-review.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ $es.refreshInterval }}
  secretStoreRef:
    name: {{ $es.secretStoreRef.name }}
    kind: {{ $es.secretStoreRef.kind }}
  target:
    name: {{ include "claims-review.secretName" . }}
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    {{- range $key, $_ := .Values.secrets.values }}
    - secretKey: {{ $key }}
      remoteRef:
        key: {{ $es.remoteKey }}
        property: {{ $key }}
    {{- end }}
{{- end }}
