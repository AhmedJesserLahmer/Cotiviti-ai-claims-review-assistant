{{- $obs := .Values.observability }}
{{- if $obs.serviceMonitor.enabled }}
{{- range $component := list "claims-api" "ai-agent" "ml-service" }}
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "claims-review.componentName" (dict "root" $ "component" $component) }}
  labels:
    {{- include "claims-review.componentLabels" (dict "root" $ "component" $component) | nindent 4 }}
    {{- with $obs.serviceMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  # job="claims-api" etc., matching the alert rules and dashboards.
  jobLabel: app.kubernetes.io/component
  selector:
    matchLabels:
      {{- include "claims-review.selectorLabels" (dict "root" $ "component" $component) | nindent 6 }}
  endpoints:
    - port: http
      path: /metrics
      interval: {{ $obs.serviceMonitor.interval }}
      scrapeTimeout: 10s
{{- end }}
{{- end }}
{{- if $obs.prometheusRule.enabled }}
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "claims-review.fullname" . }}
  labels:
    {{- include "claims-review.labels" . | nindent 4 }}
    {{- with $obs.prometheusRule.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  # Same file the local Prometheus loads (files/prometheus/ai-alerts.yml).
  groups:
    {{- (.Files.Get "files/prometheus/ai-alerts.yml" | fromYaml).groups | toYaml | nindent 4 }}
{{- end }}
{{- if $obs.grafanaDashboard.enabled }}
---
# Picked up by the Grafana sidecar (kube-prometheus-stack) via its label.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "claims-review.fullname" . }}-dashboards
  labels:
    {{- include "claims-review.labels" . | nindent 4 }}
    {{- toYaml $obs.grafanaDashboard.labels | nindent 4 }}
data:
  ai-reliability.json: |-
    {{- .Files.Get "files/grafana/ai-reliability.json" | nindent 4 }}
{{- end }}
