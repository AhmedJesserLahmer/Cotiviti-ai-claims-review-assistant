{{- if .Values.claimsApi.enabled }}
{{- $env := list
  (dict "name" "MONGO_URI" "value" (include "claims-review.mongoUri" .))
  (dict "name" "MONGO_DB_NAME" "value" .Values.mongodb.dbName)
  (dict "name" "AI_AGENT_URL" "value" (include "claims-review.url" (dict "root" . "component" "ai-agent" "port" .Values.aiAgent.port)))
  (dict "name" "ML_SERVICE_URL" "value" (include "claims-review.url" (dict "root" . "component" "ml-service" "port" .Values.mlService.port)))
  (dict "name" "REDIS_URL" "value" (include "claims-review.redisUrl" .))
-}}
{{- $secrets := list "INTERNAL_TOKEN" "AUDIT_HMAC_KEY" "JWT_SECRET" -}}
{{- $secretEnv := list -}}
{{- range $secrets }}{{- $secretEnv = append $secretEnv (dict "name" . "valueFrom" (dict "secretKeyRef" (dict "name" (include "claims-review.secretName" $) "key" . "optional" true))) -}}{{- end }}
{{ include "claims-review.workload" (dict "root" . "component" "claims-api" "values" .Values.claimsApi "port" .Values.claimsApi.port "env" (concat $env $secretEnv)) }}
{{- end }}
