# Prometheus for the local compose stack (`docker compose --profile observability up`).
# In Kubernetes the Helm chart's ServiceMonitors replace this file.
global:
  scrape_interval: 15s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: claims-api
    static_configs:
      - targets: ["claims-api:8000"]
  - job_name: ai-agent
    static_configs:
      - targets: ["ai-agent:8002"]
  - job_name: ml-service
    static_configs:
      - targets: ["ml-service:8001"]
