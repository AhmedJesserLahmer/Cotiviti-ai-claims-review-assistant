[project]
name = "ai-agent"
version = "0.1.0"
description = "LangGraph claim-review agent with the AI reliability layer."
requires-python = ">=3.11"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = [".", "../../libs/python/claims-common/src"]

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC"]

[tool.ruff.lint.isort]
known-first-party = ["claims_common", "agent", "ai_platform", "core", "data_gen", "db", "ml", "routers"]
