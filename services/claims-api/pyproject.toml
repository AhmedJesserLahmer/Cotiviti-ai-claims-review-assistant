[project]
name = "claims-api"
version = "0.2.0"
description = "Claims Review Assistant API: claims, providers, uploads and AI analysis."
requires-python = ">=3.11"
# Runtime dependencies are pinned in requirements.txt (used by the Docker image).

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = [".", "../../libs/python/claims-common/src"]
markers = [
    "integration: needs a running API or database",
]

[tool.ruff]
target-version = "py311"
line-length = 110
extend-exclude = ["data", "ml/models"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC"]
ignore = ["B008"]  # FastAPI dependency defaults (File(...), Form(...))

[tool.ruff.lint.isort]
known-first-party = ["claims_common", "agent", "ai_platform", "core", "data_gen", "db", "ml", "models", "routers"]
