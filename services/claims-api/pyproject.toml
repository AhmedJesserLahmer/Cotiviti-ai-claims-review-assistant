[project]
name = "claims-api"
version = "0.3.0"
description = "Claims Review Assistant API: claims, providers, uploads and AI analysis."
requires-python = ">=3.11"
# Runtime dependencies are pinned in requirements.txt (used by the Docker image).

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = [".", "../../libs/python/claims-common/src"]
markers = [
    "integration: needs a running API or database",
]
